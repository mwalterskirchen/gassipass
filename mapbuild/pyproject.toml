[project]
name = "mapbuild"
version = "0.1.0"
description = "Builds doggo map packages from swissTLM3D and swissBOUNDARIES3D"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pyogrio",
    "pyproj",
    "shapely",
]

[project.scripts]
mapbuild = "mapbuild.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
